<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <defs>
    <linearGradient id="whiteRulerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
  </defs>

  <g transform="rotate(-45 16 16)">
    <!-- Ruler Drop Shadow -->
    <rect x="2" y="12.2" width="28" height="10" rx="2" fill="rgba(0,0,0,0.3)" />
    
    <!-- White Ruler Body -->
    <rect x="2" y="11" width="28" height="10" rx="2" fill="url(#whiteRulerGrad)" stroke="#0f172a" stroke-width="1.4" stroke-linejoin="round" />
    
    <!-- Measurement Ticks (Crisp Dark Slate) -->
    <line x1="5.5" y1="11" x2="5.5" y2="15.5" stroke="#0f172a" stroke-width="1.3" stroke-linecap="round" />
    <line x1="8.5" y1="11" x2="8.5" y2="13.5" stroke="#475569" stroke-width="1" stroke-linecap="round" />
    <line x1="11.5" y1="11" x2="11.5" y2="15.5" stroke="#0f172a" stroke-width="1.3" stroke-linecap="round" />
    <line x1="14.5" y1="11" x2="14.5" y2="13.5" stroke="#475569" stroke-width="1" stroke-linecap="round" />
    <line x1="17.5" y1="11" x2="17.5" y2="16" stroke="#0f172a" stroke-width="1.4" stroke-linecap="round" />
    <line x1="20.5" y1="11" x2="20.5" y2="13.5" stroke="#475569" stroke-width="1" stroke-linecap="round" />
    <line x1="23.5" y1="11" x2="23.5" y2="15.5" stroke="#0f172a" stroke-width="1.3" stroke-linecap="round" />
    <line x1="26.5" y1="11" x2="26.5" y2="13.5" stroke="#475569" stroke-width="1" stroke-linecap="round" />

    <!-- Measurement dots -->
    <circle cx="11.5" cy="18" r="0.8" fill="#0f172a" />
    <circle cx="17.5" cy="18" r="0.8" fill="#0f172a" />
    <circle cx="23.5" cy="18" r="0.75" fill="#0f172a" />
  </g>
</svg>
